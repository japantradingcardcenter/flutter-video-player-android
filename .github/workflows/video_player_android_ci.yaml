name: Video player CI
on:
  push:
    branches: [jtcc/video-player-android-2.9.6]
  pull_request:
    branches: [jtcc/video-player-android-2.9.6]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/video_player/video_player_android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter 3.47.1
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin 6655482ec06e547f90abf8ae7590466f4415978d
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.47.1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: bash tool/test.sh
      - name: Analyze and test video_player
        working-directory: packages/video_player/video_player
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
